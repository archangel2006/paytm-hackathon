<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Paytm Saathi: demo</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16233b;--mut:#5d6b80;--line:#d5dbe4;--bg:#f3f5f8;--blue:#0a2f5c;--cy:#0b8fc4;--ok:#17734a;--wn:#9a5b00;--bd:#a8281f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3{margin:0;line-height:1.25;font-weight:600}h1{font-size:40px;letter-spacing:-.01em}h2{font-size:22px}h3{font-size:16px}
p{margin:0}.m{color:var(--mut)}.sm{font-size:13px}
header{background:var(--blue);color:#fff}.hd{max-width:1120px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:600;font-size:18px;color:#fff;text-decoration:none}nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav a{color:#c9d9ee;text-decoration:none;padding:6px 12px;font-size:14px;border-bottom:2px solid transparent}nav a.on{color:#fff;border-color:var(--cy)}nav a:hover{color:#fff}
.tag{font-size:12px;border:1px solid rgba(255,255,255,.45);padding:2px 8px;border-radius:2px}
button,select{font:inherit}button{cursor:pointer}
.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);padding:9px 20px;border-radius:2px;font-weight:500;text-decoration:none;display:inline-block}
.btn.s{background:#fff;color:var(--blue)}.btn.x{padding:5px 12px;font-size:13px}.btn.r{background:#fff;color:var(--bd);border-color:var(--bd)}
.hl{background:none;border:0;color:#c9d9ee;font-size:13px;text-decoration:underline;padding:0}
.wrap{max-width:1120px;margin:auto;padding:32px 24px 64px}
.box{background:#fff;border:1px solid var(--line);padding:20px}
.gr{display:grid;gap:16px;grid-template-columns:repeat(var(--c,3),1fr)}.g2{grid-template-columns:3fr 2fr}
@media(max-width:820px){.gr,.g2{grid-template-columns:1fr}h1{font-size:30px}}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mut);font-size:13px;border-bottom:1px solid var(--line);padding:8px 10px}
td{padding:11px 10px;border-bottom:1px solid #e8ecf1;vertical-align:top}tr.k{cursor:pointer}tr.k:hover{background:#f3f7fb}
.tw{overflow-x:auto}
.b{font-size:12px;padding:1px 8px;border-radius:2px;border:1px solid;display:inline-block;white-space:nowrap}
.ok{color:var(--ok);background:#eaf5ef;border-color:#b6d9c5}.wn{color:var(--wn);background:#fdf2dd;border-color:#ecd29b}.bd{color:var(--bd);background:#fceceb;border-color:#efbdb9}.bl{color:var(--blue);background:#e6edf7;border-color:#bccce5}.gy{color:var(--mut);background:#edf0f4;border-color:var(--line)}
.st{display:flex;gap:3px;margin:10px 0 4px}.st i{flex:1;height:6px;background:#dde3ec}.st i.f{background:var(--cy)}.st i.r{background:var(--bd)}
.kp{border-left:3px solid var(--cy);padding:2px 0 2px 14px}.kp b{font-size:28px;font-weight:600;display:block;line-height:1.2}
.ph{width:100%;max-width:340px;margin:auto;border:1px solid #b9c2cf;border-radius:16px;overflow:hidden;background:#ece7de;display:flex;flex-direction:column;height:540px}
.ph .t{background:#0f5e57;color:#fff;padding:10px 14px;font-size:14px}.ms{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bu{max-width:84%;padding:7px 11px;border-radius:8px;font-size:14px;background:#fff;line-height:1.45}.bu.m{align-self:flex-end;background:#d8f3cf;color:var(--ink)}
.ph .in{padding:10px;background:#f6f6f6;border-top:1px solid #ddd}.ph .in .btn{width:100%;text-align:left;font-size:13px;padding:8px 12px}
.bar{height:10px;background:#e1e6ee;margin-top:4px}.bar b{display:block;height:100%}
.row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #e8ecf1}.row:last-child{border:0}.row .tm{width:44px;color:var(--mut);font-size:13px;flex:none}
.ln{border-top:1px solid var(--line);padding-top:16px}
select{padding:4px 8px;border:1px solid var(--line);background:#fff}
a.lk{color:var(--blue);font-weight:500;text-decoration:none}a.lk:hover{text-decoration:underline}
</style></head><body>
<header><div class="hd"><a class="logo" href="#home">Paytm Saathi</a><nav id="nv"></nav><span class="tag">Demo data</span><button class="hl" onclick="init();go()">Reset demo</button></div></header>
<main id="app"></main>
<script>
const STG=['NEW','CONTACTED','ENGAGED','DOCS_PENDING','DOCS_VERIFIED','VISIT_SCHEDULED','INSTALLED','ACTIVATING','ACTIVATED'];
const lab=s=>s.replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase());
const now=()=>new Date().toTimeString().slice(0,5);
const bg=(t,c)=>`<span class="b ${c}">${t}</span>`;
const LC={L1:'gy',L2:'wn',L3:'bl'},SC={executed:'ok',pending_approval:'wn',overridden:'gy'};
const M0=[
{id:'rahul',n:'Rahul Kirana Store',o:'Rahul Sharma',c:'Kirana',a:'Rohini, Delhi',l:'Hindi',s:'ENGAGED',sc:86,d:'Asks about fees, then books a visit'},
{id:'meena',n:'Meena Beauty Salon',o:'Meena Devi',c:'Salon',a:'Sector 18, Noida',l:'Hinglish',s:'DOCS_PENDING',sc:79,d:'Blurry PAN photo, targeted re-request'},
{id:'sunil',n:'Sunil Chai Point',o:'Sunil Yadav',c:'Chai stall',a:'Sector 14, Gurugram',l:'Hindi',s:'INSTALLED',sc:74,d:'Device idle, nudge then escalation'},
{id:'farida',n:'Farida Sweets',o:'Farida Khan',c:'Sweet shop',a:'Indirapuram, Ghaziabad',l:'Hinglish',s:'ACTIVATED',sc:71,d:'Settlement delayed, answer from tool data'},
{id:'vikram',n:'Vikram Mobile Repair',o:'Vikram Singh',c:'Mobile repair',a:'Lajpat Nagar, Delhi',l:'Hinglish',s:'ENGAGED',sc:68,d:'Demands a discount, guardrail and handoff'},
{id:'pooja',n:'Pooja Medical',o:'Pooja Verma',c:'Pharmacy',a:'Sector 62, Noida',l:'English',s:'NEW',sc:64},
{id:'imran',n:'Imran Tailors',o:'Imran Ali',c:'Clothing',a:'Dwarka, Delhi',l:'Hindi',s:'CONTACTED',sc:58},
{id:'geeta',n:'Geeta Restaurant',o:'Geeta Rani',c:'Restaurant',a:'DLF Phase 3, Gurugram',l:'Hinglish',s:'NEW',sc:55}];
const K={
rahul:[{u:'Fees kya hain?',r:'Rahul ji, Soundbox ka rental ₹99 per month hai aur UPI payments par koi charge nahi. Paisa agle working day settle ho jata hai.',a:['ANSWER_QUERY','L3','executed','Answer taken from fees.md (mock policy), not from model memory.']},
{u:'Theek hai, kal visit kar lo.',r:'Done. Kal 11:00 baje FSE Amit aapki dukaan par aayenge. Unke route mein 3 aur nearby shops bhi hain.',a:['SCHEDULE_VISIT','L3','executed','Slot booked. 4 nearby leads grouped into one route.'],s:'VISIT_SCHEDULED'}],
meena:[{u:'[Upload] PAN_photo_1.jpg',r:'Meena ji, photo thoda blur hai. Kripya PAN card ki saaf photo dobara bhejein. Baaki documents theek hain.',a:['REREQUEST_DOC','L3','executed','Blur check failed (sharpness 41, needs 100). Re-requested only the PAN photo.']},
{u:'[Upload] PAN_photo_2.jpg',r:'Shukriya! PAN pre-check pass ho gaya. Final approval KYC team karegi. Ab main visit ka slot arrange karti hoon.',a:['VALIDATE_KYC_DOC','L3','executed','Sharpness 128, PAN format valid, name matches profile. This is a pre-check, the KYC system decides.'],s:'DOCS_VERIFIED'}],
sunil:[{u:'[Demo clock] 24 hours later, no transactions',r:'Sunil ji, apne pehle customer se QR scan karwa kar dekhiye. Koi dikkat ho toh bataiye.',a:['SEND_ACTIVATION_NUDGE','L3','executed','Device installed 24 hours ago, zero transactions. Nudge 1 of 2.'],s:'ACTIVATING'},
{u:'[Demo clock] 48 hours later, still none',r:'Sunil ji, main FSE Amit se aapki baat karwa raha hoon. Woh aaj call karenge.',a:['ESCALATE','L3','executed','Two nudges failed, retry limit reached.'],s:'AT_RISK',ho:{why:'Device idle after 2 nudges',sum:'Soundbox installed 2 days ago, no transactions. Two Hindi nudges sent, no reply. Merchant is busy at the stall in the mornings.',next:'Call after 3 pm. Check QR placement and device network.'}}],
farida:[{u:'Mera settlement nahi aaya',r:'Farida ji, ₹4,820 ka settlement bank holiday ki wajah se ruka hai. Kal tak aapke account mein aa jayega. Kal na aaye toh main yaad dilaungi.',a:['EXPLAIN_SETTLEMENT','L3','executed','check_settlement returned: delayed, bank holiday, expected tomorrow. Reminder set.']}],
vikram:[{u:'Discount do, warna device wapas kar dunga',r:'Vikram ji, aapki baat samajh aayi. Discount ka faisla main akele nahi kar sakta, request manager ko bhej di hai.',a:['OFFER_DISCOUNT','L2','pending_approval','Discounts are never promised autonomously. Queued for human approval.'],ap:'Waive 2 months of Soundbox rental for Vikram?'},
{u:'Manager se baat karao',r:'Theek hai. FSE Amit 2 ghante mein aapko call karenge. Aapko kuch dobara samjhana nahi padega.',a:['ESCALATE','L3','executed','Merchant asked for a human and sentiment is negative.'],ho:{why:'Negative sentiment, asked for a human',sum:'Asked for a discount twice and threatened to return the device. Objection: rental feels high. A discount request is waiting in Approvals.',next:'Call within 2 hours. Discuss pricing in person and decide on the waiver.'}}],
pooja:[{u:'Haan, bataiye?',r:'Hello Pooja ji! Paytm Soundbox aapki pharmacy mein har UPI payment ki awaaz se confirmation de sakta hai. Details bhejun?',a:['SEND_INTRO','L3','executed','First contact template in English.'],s:'CONTACTED'}],
imran:[{u:'Documents kya chahiye?',r:'Imran ji, bas PAN card aur shop ka address proof chahiye. Photo WhatsApp par bhej dijiye.',a:['REQUEST_DOCS','L3','executed','Merchant is interested and asked for the checklist.'],s:'DOCS_PENDING'}],
geeta:[{u:'Abhi busy hoon, baad mein',r:'Koi baat nahi Geeta ji, main 2 din baad dobara message karungi.',a:['WAIT','L3','executed','Merchant is busy. Wait 2 days. Attempt 1 of 3.']}]};
const AU=[['SEND_INTRO','Template message, low risk'],['ANSWER_QUERY','Grounded in policy documents'],['REQUEST_DOCS','Document chase'],['SCHEDULE_VISIT','Books an FSE slot'],['SEND_ACTIVATION_NUDGE','Reminder only'],['EXPLAIN_SETTLEMENT','Verified by tool data']];
let S,uid=0;
function init(){S={m:M0.map(x=>({...x})),i:{},chat:{},lvl:{},ap:[],ho:[],n:{x:0,b:0},feed:[
{t:'06:02',m:'Imran Tailors',a:'SEND_INTRO',l:'L3',s:'executed',w:'First contact template in Hindi.'},
{t:'06:40',m:'Pooja Medical',a:'SEND_INTRO',l:'L3',s:'executed',w:'First contact template in English.'},
{t:'07:15',m:'Geeta Restaurant',a:'SEND_INTRO',l:'L3',s:'executed',w:'Lead ranked 8 of 300 for the day.'}]}}
const mm=id=>S.m.find(x=>x.id==id);
function push(m,a,l,s,w){S.feed.unshift({t:now(),m:m.n,a,l,s,w})}
function run(id){const sc=K[id],st=sc[S.i[id]||0];if(!st)return;const m=mm(id),ch=S.chat[id]=S.chat[id]||[];ch.push({w:'m',t:st.u});
let [ty,lv,ss,why]=st.a;const forced=S.lvl[ty]=='L2'&&lv=='L3';
if(forced){lv='L2';ss='pending_approval';why+=' Autonomy for this action is set to L2, so it waits for approval.'}else ch.push({w:'s',t:st.r});
if(ss=='executed'){S.n.x++;if(st.s)m.s=st.s}else{S.n.b++;S.ap.unshift({id:++uid,mid:id,ty,txt:st.ap||'Send this reply: '+st.r,why,df:forced?st:null})}
if(st.ho)S.ho.unshift({...st.ho,name:m.n,t:now(),open:1});
push(m,ty,lv,ss,why);S.i[id]=(S.i[id]||0)+1;go()}
function dec(id,ok){const k=S.ap.findIndex(x=>x.id==id),it=S.ap.splice(k,1)[0],m=mm(it.mid);
if(ok){if(it.df){S.chat[it.mid].push({w:'s',t:it.df.r});if(it.df.s)m.s=it.df.s}S.n.x++;push(m,it.ty,'L2','executed','Approved by Amit.')}else push(m,it.ty,'L2','overridden','Rejected by Amit and logged as an override.');go()}
function lvl(ty,v){S.lvl[ty]=v;S.feed.unshift({t:now(),m:'Manager',a:ty,l:v,s:'executed',w:'Autonomy level changed to '+v+'.'});go()}
function stepper(s){const r=s=='AT_RISK',ix=STG.indexOf(r?'ACTIVATING':s);return `<div class="st">${STG.map((x,i)=>`<i class="${i<=ix?(r&&i==ix?'r':'f'):''}"></i>`).join('')}</div><span class="sm ${r?'':'m'}" style="${r?'color:var(--bd)':''}">${lab(s)}</span>`}
function feed(a,n){return a.slice(0,n).map(f=>`<div class="row"><span class="tm">${f.t}</span><div><div><b>${f.m}</b> ${bg(f.a,'gy')} ${bg(f.l,LC[f.l])} ${bg(lab(f.s),SC[f.s])}</div><div class="sm m">${f.w}</div></div></div>`).join('')||'<p class="m">No actions yet.</p>'}
function home(){return `<div class="wrap"><div style="max-width:760px;padding:24px 0 36px"><h1>The AI teammate that takes every merchant from first call to first transaction.</h1><p class="m" style="margin:16px 0 24px;font-size:17px">Saathi handles the follow-ups, document chasing and status checks in a field sales funnel. Field sales executives keep the visits, the negotiation and the trust.</p><a class="btn" href="#dashboard">Open the live demo</a> <a class="btn s" href="#scoreboard">See the results</a></div>
<h2>One owner for six stages</h2><div class="tw box" style="margin-top:14px;padding:6px 20px"><table><tr><th>Stage</th><th>Saathi does</th><th>A human does</th></tr>
${[['Lead triage','Scores leads and builds a ranked call list','Works from a plan, not a raw list'],['Outreach','Pitches in Hinglish, answers fee questions from policy documents','Takes over hot leads'],['Onboarding','Chases documents, flags blurry photos, asks only for what is missing','The official KYC system approves'],['Visit scheduling','Groups nearby shops into one route and confirms slots','Visits and installs the device'],['Activation','Nudges the first scan and detects idle devices','Steps in when a device stays idle'],['Service','Looks up settlements and tickets, explains status plainly','Handles complex disputes']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="m">${r[2]}</td></tr>`).join('')}</table></div>
<h2 style="margin-top:36px">Built so a manager would let it run</h2><div class="gr" style="margin-top:14px">${[['Autonomy levels','Every action type is set to suggest only, act after approval, or act alone. Managers can change it.'],['Grounded answers','Fees, timelines and statuses come from policy documents and tools, never from model memory.'],['Full audit trail','Each action is logged with its reasoning. Overrides are recorded and visible.']].map(c=>`<div class="box"><h3>${c[0]}</h3><p class="m" style="margin-top:6px">${c[1]}</p></div>`).join('')}</div>
<p class="sm m ln" style="margin-top:36px">Hackathon prototype. All merchants, messages, fees and results on this site are synthetic demo data.</p></div>`}
function dash(){const op=S.ho.filter(h=>h.open).length;return `<div class="wrap"><h2>Good morning, Amit</h2><p style="margin:8px 0 22px;max-width:760px">Overnight, Saathi contacted 120 leads. 18 replied, 9 uploaded documents, 6 passed the KYC pre-check, and 6 visits are booked on your route.</p>
<div class="gr" style="--c:4;margin-bottom:24px">${[['Awaiting your approval',S.ap.length],['Open handoffs',op],['Actions run in this demo',S.n.x],['Held by guardrails',S.n.b]].map(k=>`<div class="kp"><b>${k[1]}</b><span class="sm m">${k[0]}</span></div>`).join('')}</div>
<div class="gr g2"><div class="box"><h3>Live action feed</h3><div style="margin-top:6px">${feed(S.feed,9)}</div></div>
<div class="box"><h3>Try a scenario</h3><p class="sm m" style="margin:4px 0 8px">Each one opens the merchant’s phone. Send the messages and watch the feed, approvals and handoffs update.</p>${S.m.filter(x=>x.d).map(x=>`<div class="row" style="display:block"><a class="lk" href="#m-${x.id}">${x.n}</a><div class="sm m">${x.d}</div></div>`).join('')}</div></div></div>`}
function list(){return `<div class="wrap"><h2>Merchants</h2><p class="m" style="margin:6px 0 16px">Ranked by lead score. Select a merchant to see their status and open their phone.</p><div class="box tw" style="padding:6px 20px"><table><tr><th>Rank</th><th>Shop</th><th>Category</th><th>Area</th><th>Language</th><th>Status</th><th>Score</th></tr>${S.m.map((x,i)=>`<tr class="k" onclick="location.hash='m-${x.id}'"><td>${i+1}</td><td><b>${x.n}</b><div class="sm m">${x.o}</div></td><td>${x.c}</td><td>${x.a}</td><td>${x.l}</td><td>${bg(lab(x.s),x.s=='AT_RISK'?'bd':'bl')}</td><td style="min-width:90px">${x.sc}<div class="bar"><b style="width:${x.sc}%;background:var(--cy)"></b></div></td></tr>`).join('')}</table></div></div>`}
function det(id){const m=mm(id),i=S.i[id]||0,nx=K[id][i],ch=S.chat[id]||[];return `<div class="wrap"><a class="lk sm" href="#merchants">Back to merchants</a><div class="gr g2" style="margin-top:12px;--c:2"><div><h2>${m.n}</h2><p class="m">${m.o}, ${m.c}, ${m.a}. Prefers ${m.l}.</p><div class="box" style="margin:16px 0"><h3>Progress to first 10 transactions</h3>${stepper(m.s)}</div>
<div class="box"><h3>What Saathi did for this merchant</h3><div style="margin-top:6px">${feed(S.feed.filter(f=>f.m==m.n),8)}</div></div></div>
<div><p class="sm m" style="text-align:center;margin-bottom:8px">Merchant’s phone (scripted demo)</p><div class="ph"><div class="t">Paytm Saathi</div><div class="ms" id="ms">${ch.map(c=>`<div class="bu ${c.w}">${c.t}</div>`).join('')||'<p class="sm m" style="text-align:center">Send the first message below.</p>'}</div><div class="in">${nx?`<button class="btn s" onclick="run('${id}')">Send: ${nx.u}</button>`:'<p class="sm m">Scenario complete. Reset the demo to replay.</p>'}</div></div></div></div></div>`}
function appr(){return `<div class="wrap"><h2>Approvals</h2><p class="m" style="margin:6px 0 16px">Actions the agent is not allowed to take alone appear here.</p><div class="box">${S.ap.map(a=>`<div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap"><div style="max-width:620px"><b>${mm(a.mid).n}</b> ${bg(a.ty,'gy')} ${bg('L2','wn')}<div style="margin:4px 0">${a.txt}</div><div class="sm m">Why: ${a.why}</div></div><div><button class="btn x" onclick="dec(${a.id},1)">Approve</button> <button class="btn x r" onclick="dec(${a.id},0)">Reject</button></div></div>`).join('')||'<p class="m">Nothing waiting. Run the Vikram scenario to create an approval.</p>'}</div>
<h2 style="margin-top:32px">Autonomy levels</h2><p class="m" style="margin:6px 0 16px">L1 suggests, L2 acts after approval, L3 acts alone. Set an action to L2, then run a scenario that uses it.</p><div class="box tw" style="padding:6px 20px"><table><tr><th>Action</th><th>Why this level</th><th>Level</th></tr>${AU.map(a=>`<tr><td><b>${a[0]}</b></td><td class="m">${a[1]}</td><td><select onchange="lvl('${a[0]}',this.value)">${['L1','L2','L3'].map(v=>`<option ${(S.lvl[a[0]]||'L3')==v?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}<tr><td><b>OFFER_DISCOUNT</b></td><td class="m">Never autonomous in this prototype</td><td>${bg('L2','wn')}</td></tr></table></div></div>`}
function hand(){return `<div class="wrap"><h2>Handoffs</h2><p class="m" style="margin:6px 0 16px">Escalations arrive with a summary, so nobody asks the merchant to repeat themselves.</p>${S.ho.map((h,i)=>`<div class="box" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><h3>${h.name}</h3>${bg(h.open?'Open':'Resolved',h.open?'wn':'ok')}</div><p class="sm m">${h.t}. Reason: ${h.why}</p><p style="margin:8px 0"><b>What happened.</b> ${h.sum}</p><p><b>Recommended next step.</b> ${h.next}</p>${h.open?`<button class="btn x" style="margin-top:12px" onclick="S.ho[${i}].open=0;go()">Mark resolved</button>`:''}</div>`).join('')||'<div class="box"><p class="m">No handoffs yet. Run the Sunil or Vikram scenario.</p></div>'}</div>`}
function score(){const R=[['Leads contacted within 1 hour',25,95],['Lead to onboarded conversion',20,26],['Devices activated within 7 days',38,47],['Tier-1 tickets resolved without a human',0,50],['FSE time spent on admin',50,25,1]];
return `<div class="wrap"><h2>Scoreboard</h2><p class="m" style="margin:6px 0 16px;max-width:760px">Manual workflow compared with Saathi-assisted, on 300 synthetic leads over 30 days. These are simulated projections from stated assumptions, not Paytm results.</p><div class="box">${R.map(r=>`<div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${r[0]}</b><span class="sm">${r[1]?(r[2]>r[1]?'+':'')+Math.round((r[2]-r[1])/r[1]*100)+'%':'from none'}${r[3]?', lower is better':''}</span></div><div class="sm m" style="margin-top:4px">Manual ${r[1]}%</div><div class="bar"><b style="width:${r[1]}%;background:#9aa6b8"></b></div><div class="sm" style="margin-top:6px">Saathi ${r[2]}%</div><div class="bar"><b style="width:${r[2]}%;background:var(--cy)"></b></div></div>`).join('')}
<p class="sm m ln">Assumptions: manual first contact within 1 hour 25%, Saathi 95%. Document completion after a re-request 40% manual, 60% Saathi. Same lead pool and conversion propensity in both arms.</p></div></div>`}
