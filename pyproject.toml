[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paytm-saathi"
version = "0.1.0"
description = "Paytm Saathi: Autonomous AI Teammate for Merchant Onboarding and Activation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9",
    "pytest>=8.0.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "integrations*", "server*"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "e2e"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
