services:
  # 1. Backend API (FastAPI)
  - type: web
    name: paytm-saathi-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e . && python -m server.db.seed"
    startCommand: "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend Web Interface (Next.js)
  - type: web
    name: paytm-saathi-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: SAATHI_BACKEND_URL
        value: "https://paytm-saathi-backend-i661.onrender.com"
      - key: NEXT_PUBLIC_SAATHI_API_URL
        value: "/api"
